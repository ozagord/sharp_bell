<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp Bell | Under Construction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Abel&family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;800&display=swap');

        :root {
            --bg-color: #fdf6e3;
            --text-main: #657b83;
            --heading-color: #268bd2;
            --accent-color: #0085a1;
            --font-body: 'Abel', 'Helvetica Neue', sans-serif;
            --font-title: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(38, 139, 210, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 133, 161, 0.08), transparent 25%);
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s ease-out forwards;
        }

        h1 {
            font-family: var(--font-title);
            font-size: 3rem;
            color: var(--heading-color);
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 30px;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .loader {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Sharp Bell</h1>
        <h2>Skiving on data</h2>

        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <p>Something new is brewing. <br>The blog is currently undergoing a complete rebuild and will be back shortly
            <s>with a fresh new look</s> in a fresh new location.
        </p>
    </div>
</body>

</html>
